name: Build and deploy Hexcheck

on:
  # When you push a change, like a new name in players.txt.
  push:
    branches: [main]
  # Refreshes everyone's data every 6 hours.
  schedule:
    - cron: '17 */6 * * *'
  # Adds a "Run workflow" button on the repo's Actions tab, to refresh right now.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Build the site
        run: node scripts/build.js
        env:
          HYPIXEL_API_KEY: ${{ secrets.HYPIXEL_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
