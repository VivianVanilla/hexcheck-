<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://mc-heads.net; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Hexcheck: what's left to max your SkyBlock weapon</title>
    <meta name="description" content="Search a SkyBlock username and see which enchantments, books, stars and gems are left to max each weapon." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="landing">
    <header class="top">
      <a class="brand" href="./">Hexcheck</a>
      <p class="tagline">See what's left to max any SkyBlock weapon.</p>
      <form id="search" class="search" role="search">
        <label for="name" class="visually-hidden">Minecraft username</label>
        <input id="name" name="name" type="text" placeholder="Minecraft username" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false" required />
        <button type="submit">Search</button>
      </form>
    </header>

    <p id="status" class="visually-hidden" role="status"></p>
    <main id="app"></main>

    <footer class="foot">
      <p>
        Checks the inventory, ender chest, backpacks and personal vault. Enchant lists are by weapon type, so a few may not fit one specific weapon.
      </p>
      <p>
        Not affiliated with Hypixel. Data from the Hypixel API and the NotEnoughUpdates and SkyHanni repos.
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
